name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Mypy
        run: uv run mypy dbot/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Content commit
        id: content
        run: echo "sha=$(git rev-parse HEAD:content)" >> "$GITHUB_OUTPUT"

      # Catalog index and assembled scripts are keyed by content commit.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/dbot
          key: dbot-cache-${{ steps.content.outputs.sha }}-${{ hashFiles('dbot/catalog/**', 'dbot/sandbox/**') }}
          restore-keys: dbot-cache-${{ steps.content.outputs.sha }}-

      # The ubuntu runner has a docker daemon, so `docker`-marked tests run here.
      - name: Run tests
        run: uv run pytest -v

  llm-eval:
    name: LLM eval (ollama + MCP)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OLLAMA_VERSION: "0.40.15"
      OLLAMA_MODEL: granite4:3b
      OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
      DBOT_EVAL_MODEL: ollama:granite4:3b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      # CPU-only: the release tarball minus its CUDA and Vulkan backends, unpacked into the runner user's home.
      - name: Install ollama
        run: |
          mkdir -p "$HOME/.local/ollama"
          curl -fsSL "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
            | tar --zstd -x -C "$HOME/.local/ollama" --exclude='lib/ollama/cuda_*' --exclude='lib/ollama/vulkan'
          echo "$HOME/.local/ollama/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ env.OLLAMA_MODEL }}-${{ env.OLLAMA_VERSION }}

      # Runs as the runner user, so models live in ~/.ollama. The OpenAI-compatible API ignores num_ctx.
      - name: Start ollama
        run: |
          OLLAMA_CONTEXT_LENGTH=8192 nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 30); do
            curl -fs http://127.0.0.1:11434/api/version && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/ollama.log"
          exit 1

      - name: Pull model
        run: ollama pull "$OLLAMA_MODEL"

      # pydantic-ai on ollama -> dbot MCP server / responder -> real Gateway -> DockerSandbox -> mitmdump replaying
      # tests/certified fixtures. The runner's docker daemon and the dev group's mitmproxy are all it needs.
      - name: Run LLM eval
        run: uv run pytest -m llm tests/llm -v -rs --basetemp="$RUNNER_TEMP/llm-eval"

      # Per-attempt model messages, tap logs (tools/call received), gateway audit JSONL and IR reports. No secrets:
      # the audit is redacted and instances use the replay proxy's fake keys.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: llm-eval
          path: |
            ${{ runner.temp }}/llm-eval/**/*.jsonl
            ${{ runner.temp }}/llm-eval/**/report.json
            ${{ runner.temp }}/llm-eval/**/mitmdump.log
            ${{ runner.temp }}/ollama.log
          if-no-files-found: ignore

  probe:
    name: Integration probe (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Probe
        run: uv run python -m dbot.sandbox.probe --json probe.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe
          path: probe.json
          if-no-files-found: warn
