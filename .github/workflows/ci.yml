name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Mypy
        run: uv run mypy dbot/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Content commit
        id: content
        run: echo "sha=$(git rev-parse HEAD:content)" >> "$GITHUB_OUTPUT"

      # Catalog index and assembled scripts are keyed by content commit.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/dbot
          key: dbot-cache-${{ steps.content.outputs.sha }}-${{ hashFiles('dbot/catalog/**', 'dbot/sandbox/**') }}
          restore-keys: dbot-cache-${{ steps.content.outputs.sha }}-

      # The ubuntu runner has a docker daemon, so `docker`-marked tests run here.
      - name: Run tests
        run: uv run pytest -v

  llm-eval:
    name: LLM eval (opencode + MCP)
    runs-on: ubuntu-latest
    # Advisory on PRs and pushes, required nightly.
    continue-on-error: ${{ github.event_name != 'schedule' }}
    timeout-minutes: 90
    # Secrets are unavailable to fork and Dependabot PRs; the test skips without the key.
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install opencode
        run: npm install -g @opencode/cli@2.2.6

      # opencode -> dbot MCP server -> real Gateway -> DockerSandbox -> mitmdump replaying tests/certified fixtures.
      # The runner's docker daemon and the dev group's mitmproxy are all the eval needs besides opencode.
      - name: Run LLM eval
        run: uv run pytest -m llm tests/llm -v -rs --basetemp="$RUNNER_TEMP/llm-eval"

      # Per-attempt opencode events, tap logs (tools/call received) and gateway audit JSONL. No secrets:
      # the audit is redacted and instances use the replay proxy's fake keys.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: llm-eval
          path: |
            ${{ runner.temp }}/llm-eval/**/*.jsonl
            ${{ runner.temp }}/llm-eval/**/mitmdump.log
          if-no-files-found: ignore

  probe:
    name: Integration probe (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Probe
        run: uv run python -m dbot.sandbox.probe --json probe.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe
          path: probe.json
          if-no-files-found: warn
