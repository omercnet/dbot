[project]
name = "dbot"
dynamic = ["version"]
description = "XSOAR content runtime for SOCs: sandboxed integrations behind an audited gateway, exposed over MCP and an alert responder."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = ["mcp", "xsoar", "security", "integrations", "demisto", "soc"]
dependencies = [
    "fastmcp>=2.10",
    "pydantic>=2.0",
    "pydantic-ai>=1.0",
    "pyyaml>=6.0",
    "starlette>=0.40",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
dbot = "dbot.cli:app"

[project.urls]
Documentation = "https://github.com/omercnet/dbot#readme"
Issues = "https://github.com/omercnet/dbot/issues"
Source = "https://github.com/omercnet/dbot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "dbot/__init__.py"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.11",
    "mypy>=1.10",
    "mitmproxy>=12.3",
]

# ── Ruff ──────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["content"]

[tool.ruff.format]
exclude = ["*.md"]  # docs code blocks are illustrative, not formatted source

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    # TCH skipped — PydanticAI introspects type annotations at runtime
    "ARG",  # flake8-unused-arguments
    "PLC",  # pylint convention
    "PLE",  # pylint error
    "PLW",  # pylint warning
]
ignore = [
    "S101",    # assert — allowed in tests (per-file-ignores)
    "RET504",  # unnecessary assign before return — readability
    "ARG001",  # unused function arg — callbacks/overrides/Starlette handlers
    "ARG002",  # unused method arg — callbacks/overrides
    "PLC0415", # import not at top-level — lazy imports are intentional (perf + circular deps)
    "A002",    # argument shadows builtin — 'type' is a common domain arg
    "PLW1641", # no __hash__ — shim classes don't need it
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "ARG", "PT004"]

[tool.ruff.lint.isort]
known-first-party = ["dbot"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

# ── Pytest ────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not llm'"
markers = [
    "docker: needs a docker daemon; skips itself when docker is unavailable",
    "llm: real-LLM evals via the opencode CLI (run with -m llm; needs OPENCODE_API_KEY)",
]

# ── Mypy ──────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

# ── Coverage ──────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["dbot"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
